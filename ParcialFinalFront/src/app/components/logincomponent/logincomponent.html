<h1>Tienda de Barrio</h1>
<h2>Iniciar sesión</h2>

@if (sesionVencida) {
  <p>Tu sesión terminó. Inicia sesión de nuevo.</p>
}
@if (error()) {
  <p>{{ error() }}</p>
}

<form (ngSubmit)="iniciarSesion()">
  <p>
    <label for="usuario">Usuario</label><br />
    <input id="usuario" name="usuario" [(ngModel)]="usuario" autocomplete="username" />
  </p>
  <p>
    <label for="clave">Contraseña</label><br />
    <input id="clave" name="clave" type="password" [(ngModel)]="clave" autocomplete="current-password" />
  </p>
  <button type="submit" [disabled]="cargando()">{{ cargando() ? 'Entrando...' : 'Entrar' }}</button>
</form>
