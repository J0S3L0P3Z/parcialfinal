<div class="card tarjeta-acceso">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock fs-1 text-primary"></i>
      <h1 class="h4 mt-2 mb-1">Iniciar sesión</h1>
      <p class="text-muted small mb-0">Entra con tu usuario o tu correo</p>
    </div>

    @if (sesionVencida) {
      <div class="alert alert-info py-2">Tu sesión terminó. Inicia sesión de nuevo.</div>
    }
    @if (error()) {
      <div class="alert alert-danger py-2">{{ error() }}</div>
    }

    <form (ngSubmit)="iniciarSesion()">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario o correo</label>
        <input id="usuario" name="usuario" class="form-control" [(ngModel)]="usuario" autocomplete="username" />
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input id="clave" name="clave" type="password" class="form-control" [(ngModel)]="clave" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm me-1"></span> Entrando...
        } @else {
          Entrar
        }
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</div>
