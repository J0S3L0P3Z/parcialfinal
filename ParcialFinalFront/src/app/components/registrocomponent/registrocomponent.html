<div class="card tarjeta-acceso">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus fs-1 text-primary"></i>
      <h1 class="h4 mt-2 mb-0">Crear cuenta</h1>
    </div>

    @if (error()) {
      <div class="alert alert-danger py-2">{{ error() }}</div>
    }
    @if (exito()) {
      <div class="alert alert-success py-2">{{ exito() }}</div>
    }

    <form (ngSubmit)="crearCuenta()">
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input id="usuario" name="usuario" class="form-control" [(ngModel)]="usuario" autocomplete="username" />
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input id="correo" name="correo" type="email" class="form-control" [(ngModel)]="correo" autocomplete="email" />
      </div>
      <div class="mb-3">
        <label for="clave" class="form-label">Contraseña</label>
        <input id="clave" name="clave" type="password" class="form-control" [(ngModel)]="clave" autocomplete="new-password" />
        <div class="form-text">Mínimo 8 caracteres, con minúscula, mayúscula, número y símbolo.</div>
      </div>
      <div class="mb-3">
        <label for="confirmarClave" class="form-label">Confirmar contraseña</label>
        <input id="confirmarClave" name="confirmarClave" type="password" class="form-control" [(ngModel)]="confirmarClave" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando() || !!exito()">
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm me-1"></span> Creando...
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
